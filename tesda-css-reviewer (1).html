<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TESDA CSS Reviewer</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--tx:#1b1f2a;--mu:#6b7285;--ac:#4f46e5;--ac2:#06b6d4;--ok:#16a34a;--no:#dc2626;--bd:#e3e6ef;--hi:#eef0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#1a1d27;--tx:#eceef6;--mu:#9aa1b5;--ac:#818cf8;--ac2:#22d3ee;--ok:#4ade80;--no:#f87171;--bd:#2c3140;--hi:#24284a}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#1a1d27;--tx:#eceef6;--mu:#9aa1b5;--ac:#818cf8;--ac2:#22d3ee;--ok:#4ade80;--no:#f87171;--bd:#2c3140;--hi:#24284a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,sans-serif}
main{max-width:680px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:18px;padding:24px 20px;margin-bottom:16px}
.hero h1{margin:0;font-size:1.5rem}.hero p{margin:4px 0 0;opacity:.9}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
h2{font-size:1.05rem;margin:0 0 10px}
button{font:inherit;border:0;border-radius:12px;padding:12px 18px;background:var(--ac);color:#fff;cursor:pointer;font-weight:600}
button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}
#nm{font:inherit;width:100%;padding:12px 14px;border:2px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);outline:0}
#nm:focus{border-color:var(--ac)}#nm.err{border-color:var(--no)}
.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sc{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:16px 8px;text-align:center}
.sc b{display:block;font-size:1.8rem;color:var(--ac)}.sc small{color:var(--mu);font-weight:400}
.sc:hover{border-color:var(--ac)}
.q{font-size:1.1rem;line-height:2.3}
input.b{font:inherit;width:9em;max-width:100%;padding:3px 8px;border:0;border-bottom:2px solid var(--ac);background:var(--hi);border-radius:6px 6px 0 0;color:var(--tx);outline:0;text-align:center}
input.ok{border-color:var(--ok);color:var(--ok)}input.no{border-color:var(--no);color:var(--no)}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:.92rem;gap:8px}
.chip{background:var(--hi);color:var(--ac);padding:3px 10px;border-radius:99px;font-weight:600}
.bar{height:8px;background:var(--bd);border-radius:4px;margin:8px 0 14px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:4px;transition:width .3s}
.fb{margin-top:10px;font-weight:600}.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.mi{font-size:.92rem;color:var(--mu);border-top:1px solid var(--bd);padding:8px 0}
.big{font-size:2.6rem;font-weight:800;color:var(--ac);line-height:1.1}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{padding:8px 14px;font-size:.9rem}
table{width:100%;border-collapse:collapse}td,th{padding:10px 6px;text-align:left;border-bottom:1px solid var(--bd);font-size:.95rem}
th{color:var(--mu);font-weight:600;font-size:.8rem}tr.me{background:var(--hi)}td.r{width:44px;font-size:1.2rem}
.mu{color:var(--mu);font-size:.9rem}label{color:var(--mu);font-size:.95rem}
</style></head><body><main id="app"></main>
<script>
const D={
A:[
["___ is an interface standard designed for high-speed serial bus communication.","Firewire"],
["The ___ is a micro-chip responsible for managing data communication between the CPU and motherboard.","Input/Output Controller Hub|ICH|IOCH"],
["___ is a setup option in UEFI/BIOS that allows security settings to perform certain tasks.","Lojack"],
["___ is text-based command used for creating a bootable flash drive.","Disk part"],
["In Windows 7, if the ___ is not installed, only the ___ will be displayed.","Video driver;standard video"],
["When a ___ is shorted, the ___ reading will be zero volts.","Diode;voltmeter"],
["___ is the process of joining two cable ends together.","Cable Splicing|Splicing"],
["A ___ is a hardware device that enables the connection of serial devices across a network.","Terminal Server"],
["The IP Address 10.10.10.1 belongs to ___.","Class A"],
["A ___ can typically connect up to ___ devices.","Wireless router;250"],
["An ___ is a device that acts as a bridge between wireless clients and a wired network.","Access Point|AP"],
["A ___ is a logical subnetwork that groups a collection of devices from the same network switch.","Virtual Lan (VLAN)"],
["___ refers to the time lapse between data being sent and received, and it can have a significant impact on performance.","Latency"],
["___ means pushing components to their limits and extremes to assess their performance.","Stress Testing|Stress Test"],
["A ___ is a type of server that enables large numbers of users to exchange information near instantaneously. It was formerly known as an ___ server.","Real-time Communication Server|Real-time Communication;IRC (Internet Relay Chat)"],
["___ ensures that information and programs change only in a specified and authorized manner.","Integrity"],
["___ is a command-line network utility that displays network connections for TCP and routing tables.","Netstat"],
["___ is a set of rules that describes how software and hardware should interact within a network.","Communications protocol|Protocol"],
["___ refers to attachments that include the execution of viruses, worms, trojan horses, and active web scripts with the intent to destroy or steal information.","Malicious code|Malware"],
["___ is a set of rules for transferring files such as text, graphics, images, sounds, and other multimedia files on the World Wide Web.","Hypertext Transfer Protocol (HTTP)"],
["___ is the traditional method used to access server data, using the Server Message Block (SMB) protocol over TCP/IP.","Windows Folder Sharing|Folder Sharing"],
["The command line utilities used to export and import Active Directory object information are ___ and ___.","idifde.exe|idifde;csvde.exe|csvde"],
["A ___ is a node in a computer network that allows data to flow from one discrete network to another.","Gateway"],
["When performing continuity testing of twisted pair cable, the electrical quantity measured is ___.","Resistance"],
["___ is the type of backup used for hard drives, discs, flash drives, and external drives that are housed on-site.","Local Backup"],
["___ is a recovery tool in Windows that fixes and scans computer problems that prevent the computer from booting repeatedly.","Startup Repair"],
["___ is used to run commands for troubleshooting and accessing a bootable operating system.","Windows recovery environment|WinRE"],
["A ___ is an electronic component that needs to discharge electrically before the replacement of parts.","Capacitor"],
["The most current wireless networking standard that can communicate with older network standards is ___.","802.11ax|802 Tin|Wi-Fi 6"],
["___ is a 24-port USB connector system with a rotationally symmetrical connector.","USB C Thunderbolt|USB C|Thunderbolt|USB Type-C"]],
B:[
["The ___ provides voltages of 3.3V, 5V, and 12V to the motherboard.","ATX12V P1 Connector|ATX12V P1|P1 Connector"],
["___ is defined as a structured network cabling system standard for commercial buildings and between buildings in campus environments.","ANSI/TIA-568|TIA-568"],
["___ refers to pieces of related information that are transferred through a network.","Connection"],
["The IP Address 172.168.10.1 belongs to ___.","Class B"],
["An ___ is a type of router that enables an internal network to connect to an external network.","Edge Router"],
["___ pertains to the maximum data transfer rate of a network for internet connection.","Bandwidth"],
["A ___ is a type of high-speed network composed of hosts and interconnects using a variety of technology/topology.","Storage Area Network (SAN)"],
["___ acts like a border router to connect corporate sites to wired access lines.","Customer Premises Equipment (CPE)"],
["___ is the process of recognizing user's identity.","Authentication"],
["An ___ is a type of server that occupies a large portion of computing territory between the database server and end users.","Application server"],
["Refers to a privilege or assigned permission for the use of computer data or resources. ___","Access"],
["___ is the media type of ___ that consists of broadband coaxial cable carrying multiple baseband channels for a maximum length of ___.","10BASE-36;10 Megabit ethernet|10 Mbps ethernet;3600 meters|3600 m"],
["A ___ is a network security system that monitors and controls incoming and outgoing network traffic based on predetermined security rules.","Firewall"],
["___ is the term used to refer to when a system is unavailable.","Downtime"],
["___ is the command used to certify peer name resolution in ___.","NSLOOKUP;Active Directory"],
["___ is the Active Directory Protocol used to access data from the database.","Lightweight Directory Access Protocol (LDAP)"],
["___ displays measures and various real-time statistics on the system's performance.","View current activity"],
["A ___ is a type of peripheral card that has a media access control address.","Network Interface card (NIC)"],
["A ___ is a term for the main patch panel that links to every telecommunication room inside a building.","Vertical cross-connect"],
["___ is an enclosed or semi-enclosed channel that protects, routes, and hides cables and wires.","Raceway"],
["A ___ is a material that is slid before crimping both ends of a patch cable and acts to reduce strain in the cable.","Boot"],
["A ___ is a test that verifies the operation of a communication device by sending and receiving data from the same port.","loopback test|loopback"],
["A ___ is a networking tool that monitors and intercepts traffic over a computer network.","Packet Analyzer"],
["The ___ of an open wire is ___.","Resistance reading;infinite ohms|infinite"],
["The maximum cable length for USB 3.0 using a non-twisted pair wire is ___.","3 meters|3 m"],
["___ is a form factor for storage drives.","M.2"],
["___ chip stores the settings in the BIOS.","Real Time Clock (RTC)|Non-volatile RAM (NVRAM)|CMOS"],
["An ___ is used as a substitute for an actual disk, allowing users to run software without having to load a CD or DVD.","ISO File|ISO"],
["___ has a program capable of restricting other user's access to certain programs on a computer.","Windows Ultimate Edition|Ultimate"],
["The device driver can be found in ___.","System32 folder|System32"]],
C:[
["___ allows users to define a list of devices and only allow those devices on the wi-fi network.","MAC Address filtering"],
["A ___ connects through signals such as INFRARED.","Wireless Personal Area Network (WPAN)"],
["A ___ allows users to move around the coverage area in line of sight while maintaining a network connection.","Wireless Local Area Network (WLAN)"],
["___ is an enterprise-level heterogeneous backup and recovery suite.","NetBackup"],
["A ___ is a type of server that allows the central administration and management of network users and network resources.","Directory server"],
["___ refers to an information asset suffering damage, unintended modification, or disclosure.","Loss"],
["___ is the network security standard that tries to make the connection between a router and wireless devices faster and easier.","WPS (Wi-Fi Protected Setup)"],
["___ is the most efficient in transferring larger files.","File Transfer Protocol (FTP)"],
["___ is a technique used to gain unauthorized access to computers wherein the intruder sends messages with a source IP Address.","Spoofing"],
["___ enables administrators to define the types of files that can be saved within a Windows volume and folder.","File Screening"],
["The maximum cable length for USB 3.0 using a non-twisted pair wire is ___.","3 meters|3 m"],
["___ is the compound used to prevent CPU overheating.","Thermal Paste"],
["The maximum cable length for USB 2.0 is ___.","5 meters|5 m"],
["___ is the software program stored into ROM.","Firmware"],
["A ___ is also known as ISO image.","Disc image|Disk image"],
["The minimum RAM requirement for Windows 10 is ___.","1 GB for 32-Bit or 2 GB for 64-bit|1 GB|2 GB"],
["___ is the extension of ___ used to manage hardware devices, including device drivers.","Device Manager;MS Management Console|Microsoft Management Console|MMC"],
["The volt rating of the yellow wire in a PSU is ___.","+12V|12V"],
["Yost, Cisco, and console cable are also known as ___.","Roll-Over Cables|Rollover"],
["In ___, a LAN connection icon in yellow color indicates ___.","Server 2008;no connectivity"],
["The ___ in a network interface card typically has ___.","LED;two lights|2 lights"],
["___ is an application of NAT that redirects communication requests from one address and port number combination to another.","Forwarding|Port Forwarding"],
["___ is the alternative for wired connection that uses radio frequencies to send signals between devices and a router.","Wireless Fidelity (Wi-Fi)"],
["A ___ is a computer Network made up of an interconnection of LANs within a limited geographical area.","Campus Area Network (CAN)"],
["___ is a term that applies to the interconnection of LANs in a city within a range of 5 to 50 kilometers.","Metropolitan Area Network (MAN)"],
["A ___ is assigned to monitor network security, operation, and network users.","Network Administrator|Network Admin"],
["A ___ is used to store user documents with a large amount of memory and storage space.","File Server"],
["___ is a way to identify a specific process to which an internet or other network message is forwarded when it arrives at a server.","Port Number|Port"],
["A ___ is an automated software program that executes certain commands when it receives a specific input.","Bot"],
["___ enables administrators to configure storage thresholds on particular sets of data stored on server NTFS volumes.","File System Quota|Quota"]]
};
const N=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
function ok(inp,key){const set=new Set();key.split("|").forEach(v=>{set.add(N(v));const m=v.match(/^(.*)\((.*)\)(.*)$/);if(m){set.add(N(m[1]+m[3]));set.add(N(m[2]))}});set.delete("");return set.has(N(inp))}
const store={g(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=t=>Math.floor(t/60)+":"+String(t%60).padStart(2,"0");
const app=document.getElementById("app");
let tmr,Q,i,score,missed,done,t0,name,user=store.g("tcr_user",""),shuf=false;
const recs=()=>store.g("tcr_rec",[]);
function tick(){const e=document.getElementById("tm");if(e)e.textContent="⏱ "+fmt(Math.round((Date.now()-t0)/1000))}
function best(set){const m={};recs().filter(r=>!set||r.s===set).forEach(r=>{const k=r.n.toLowerCase()+"|"+r.s,o=m[k];if(!o||r.sc>o.sc||(r.sc===o.sc&&r.t<o.t))m[k]=r});return Object.values(m)}
function home(){clearInterval(tmr);const mine=s=>{const b=best(s).find(r=>r.n.toLowerCase()===user.toLowerCase());return b?"Best "+b.sc+"/30":"Not taken"};
app.innerHTML=`<div class="hero"><h1>📝 TESDA CSS Reviewer</h1><p>Practice, beat your best score, and beat your best time.</p></div>
<div class="card"><h2>Student name</h2><input id="nm" placeholder="Enter your full name" maxlength="30" value="${esc(user)}" oninput="this.classList.remove('err')"></div>
<div class="card"><h2>Choose your set</h2><div class="sets">${["A","B","C"].map(s=>`<button class="sc" onclick="start('${s}')"><small>Set</small><b>${s}</b><small>${user?mine(s):"30 items"}</small></button>`).join("")}</div>
<p style="margin:14px 0 0"><label><input type="checkbox" ${shuf?"checked":""} onchange="shuf=this.checked"> Shuffle questions</label></p>
<p class="mu" style="margin:8px 0 0">Capitals, spaces and punctuation are ignored. Abbreviations are accepted.</p></div>
<button class="g" style="width:100%" onclick="openRec()">🏆 My records</button>`}
function start(s){const el=document.getElementById("nm");const v=el.value.trim();if(!v){el.classList.add("err");el.focus();return}
user=v;store.s("tcr_user",v);name=s;Q=D[s].slice();if(shuf)Q.sort(()=>Math.random()-.5);i=0;score=0;missed=[];t0=Date.now();show()}
function show(){done=false;const t=Q[i][0];let c=0;
const html=esc(t).replace(/___/g,()=>`<input class="b" data-i="${c++}" autocomplete="off" autocapitalize="off" spellcheck="false">`);
app.innerHTML=`<div class="top"><span class="chip">👤 ${esc(user)}</span><span>Set ${name} · ${i+1}/${Q.length} · Score ${score}</span><span class="chip" id="tm">⏱ 0:00</span></div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div>
<div class="card"><div class="q">${html}</div><div id="fb"></div><div class="row"><button id="go" onclick="act()">Check</button><button class="g" onclick="home()">Quit</button></div></div>`;
clearInterval(tmr);tmr=setInterval(tick,1000);tick();const f=app.querySelector("input");if(f)f.focus()}
function act(){const ins=[...app.querySelectorAll("input.b")];
if(done){i++;i<Q.length?show():fin();return}
const keys=Q[i][1].split(";");let all=true;
ins.forEach((el,j)=>{const r=ok(el.value,keys[j]||"");el.className="b "+(r?"ok":"no");el.disabled=true;if(!r)all=false});
done=true;const ans=keys.map(k=>k.split("|")[0]).join(" / ");if(all)score++;else missed.push([Q[i][0],ans]);
document.getElementById("fb").innerHTML=all?`<div class="fb ok">✓ Correct!</div>`:`<div class="fb no">✗ Answer: ${esc(ans)}</div>`;
const g=document.getElementById("go");g.textContent=i+1<Q.length?"Next":"Finish";g.focus()}
function fin(){clearInterval(tmr);const t=Math.round((Date.now()-t0)/1000),r=recs();
const prev=r.filter(x=>x.n.toLowerCase()===user.toLowerCase()&&x.s===name),mx=prev.length?Math.max(...prev.map(x=>x.sc)):-1;
const pb=!prev.length||score>mx||(score===mx&&t<Math.min(...prev.filter(x=>x.sc===score).map(x=>x.t)));
r.push({n:user,s:name,sc:score,t,d:Date.now()});store.s("tcr_rec",r);const pct=Math.round(score/Q.length*100);
app.innerHTML=`<div class="hero"><h1>Great job, ${esc(user)}!</h1><p>Set ${name} complete</p></div>
<div class="card" style="text-align:center"><div class="big">${score}/${Q.length}</div><p class="mu" style="margin:4px 0">${pct}% · ⏱ ${fmt(t)}</p>
${pb?`<p style="margin:10px 0 0;font-weight:700;color:var(--ok)">🎉 New personal best!</p>`:""}
<div class="row" style="justify-content:center"><button onclick="retry()">Retry</button><button class="g" onclick="records()">🏆 My records</button><button class="g" onclick="home()">Home</button></div></div>
${missed.length?`<div class="card"><h2>Review missed (${missed.length})</h2>${missed.map(m=>`<div class="mi">${esc(m[0]).replace(/___/g,"<b>_____</b>")}<br><b style="color:var(--ok)">${esc(m[1])}</b></div>`).join("")}</div>`:""}`}
function retry(){Q=D[name].slice();if(shuf)Q.sort(()=>Math.random()-.5);i=0;score=0;missed=[];t0=Date.now();show()}
function openRec(){const el=document.getElementById("nm"),v=el.value.trim();if(!v){el.classList.add("err");el.focus();return}user=v;store.s("tcr_user",v);records()}
function records(){clearInterval(tmr);const mine=recs().filter(x=>x.n.toLowerCase()===user.toLowerCase());
const bs=k=>{const a=mine.filter(x=>x.s===k);if(!a.length)return null;return{top:a.slice().sort((p,q)=>q.sc-p.sc||p.t-q.t)[0],fast:a.slice().sort((p,q)=>p.t-q.t)[0],n:a.length}};
const all=["A","B","C"].map(bs).filter(Boolean),tsc=all.reduce((x,b)=>x+b.top.sc,0),tt=all.reduce((x,b)=>x+b.top.t,0);
const card=k=>{const b=bs(k);return b?`<div class="card"><h2>Set ${k}</h2><div class="big">${b.top.sc}/30</div><p class="mu" style="margin:4px 0 0">Time on top score: ⏱ ${fmt(b.top.t)}<br>Fastest run: ⏱ ${fmt(b.fast.t)} (${b.fast.sc}/30)<br>${b.n} attempt${b.n>1?"s":""}</p></div>`:`<div class="card"><h2>Set ${k}</h2><p class="mu" style="margin:0">No record yet.</p></div>`};
app.innerHTML=`<div class="hero"><h1>🏆 My Records</h1><p>${esc(user)} · best score and time per set</p></div>
<div class="card" style="text-align:center"><h2>Overall</h2>${all.length?`<div class="big">${tsc}/90</div><p class="mu" style="margin:4px 0 0">Total time: ⏱ ${fmt(tt)}<br>${all.length} of 3 sets taken</p>`:`<p class="mu" style="margin:0">Take a set to start your records.</p>`}</div>
${["A","B","C"].map(card).join("")}
${mine.length?`<div class="card"><h2>Recent attempts</h2>${mine.slice(-8).reverse().map(x=>`<div class="mi">Set ${x.s} · <b>${x.sc}/30</b> · ⏱ ${fmt(x.t)}${x.d?" · "+new Date(x.d).toLocaleDateString():""}</div>`).join("")}</div>`:""}
<div class="row"><button onclick="home()">Back</button>${mine.length?`<button class="g" onclick="if(confirm('Delete all records for ${esc(user).replace(/'/g,"")}?')){store.s('tcr_rec',recs().filter(x=>x.n.toLowerCase()!==user.toLowerCase()));records()}">Reset my records</button>`:""}</div>`}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&Q&&app.querySelector("#go")){e.preventDefault();const ins=[...app.querySelectorAll("input.b")],ix=ins.indexOf(document.activeElement);if(!done&&ix>=0&&ix<ins.length-1)ins[ix+1].focus();else act()}});
home();
</script></body></html>
